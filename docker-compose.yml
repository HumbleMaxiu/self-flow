services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: self_flow
      POSTGRES_PASSWORD: self_flow
      POSTGRES_DB: self_flow
    ports:
      - "5432:5432"
    volumes:
      - self_flow_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - self_flow_redis_data:/data

volumes:
  self_flow_postgres_data:
  self_flow_redis_data:

